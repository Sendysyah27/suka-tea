name: flutter-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Pin 3.47.8 — versi yang terbukti hijau di SSR-SPACE.
          # 3.50.1 bermasalah deprecation (117 issues di SSR-SPACE).
          flutter-version: "3.47.8"
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
