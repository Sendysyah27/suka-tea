name: flutter-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pin Java 17: Gradle 8.11.1 + AGP 8.7.3 tidak jalan di Java 25
      # (default runner) — "Unsupported class file major version 69".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          # Pin 3.47.8 — versi yang terbukti hijau di SSR-SPACE.
          # 3.50.1 bermasalah deprecation (117 issues di SSR-SPACE).
          flutter-version: "3.47.8"
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      # Live: Supabase URL + anon key disuntik dari GitHub Actions secrets
      # (SUPABASE_URL, SUPABASE_ANON_KEY) — jangan hardcode di repo.
      # arm64-only: POVA 5 (dan target install) pakai arm64 — APK fat
      # 165 MB buang-buang waktu install, arm64 saja jauh lebih kecil.
      # --target-platform saja tidak cukup: .so plugin (dartjni, sqlite3,
      # datastore) tetap ikut ter-packaging untuk armeabi-v7a/x86_64.
      # --split-per-abi membuat APK per ABI yang benar-benar hanya berisi
      # lib ABI itu; dengan --target-platform android-arm64 hasilnya
      # hanya app-arm64-v8a-debug.apk.
      - run: flutter build apk --debug --target-platform android-arm64 --split-per-abi --dart-define SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      # Biar APK-nya bisa diunduh dari halaman run (tanpa ini APK hilang
      # begitu job selesai).
      - uses: actions/upload-artifact@v4
        with:
          name: suka-tea-debug-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
