name: flutter-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pin Java 17: Gradle 8.11.1 + AGP 8.7.3 tidak jalan di Java 25
      # (default runner) — "Unsupported class file major version 69".
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          # Pin 3.47.8 — versi yang terbukti hijau di SSR-SPACE.
          # 3.50.1 bermasalah deprecation (117 issues di SSR-SPACE).
          flutter-version: "3.47.8"
          channel: stable
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test
      # Live: Supabase URL + anon key disuntik dari GitHub Actions secrets
      # (SUPABASE_URL, SUPABASE_ANON_KEY) — jangan hardcode di repo.
      - run: flutter build apk --debug --dart-define SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
