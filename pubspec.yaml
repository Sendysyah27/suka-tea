name: suka_tea
description: "SUKA TEA — POS kasir es teh (Flutter + Supabase)"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.6 # Batch C9 — SHA-256 untuk normalizeLegacyClientUuid
  drift: ^2.24.0
  drift_flutter: ^0.2.0
  flutter_svg: ^2.0.10
  image: ^4.5.4
  image_picker: ^1.2.1 # terbaru 1.2.x (pub.dev, Nov 2026) — butuh Flutter 3.29+/Dart 3.7+, CI 3.47.8 OK; Android Photo Picker, minSdk 24 OK
  intl: ^0.20.2
  mobile_scanner: ^7.5.0
  path: ^1.9.0
  path_provider: ^2.1.0
  pdf: ^3.11.0
  qr_flutter: ^4.1.0
  share_plus: ^10.1.4
  supabase_flutter: ^2.9.0

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: ^2.24.0
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/icons/nav/
    - assets/icons/pay/
    - assets/products/
    - assets/splash/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
